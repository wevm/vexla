[workspace]
members = ["crates/flargs", "crates/flargs-definitions", "crates/flargs-macros"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/wevm/flargs"
rust-version = "1.88"
version = "0.0.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
flargs-definitions = { path = "crates/flargs-definitions", version = "0.0.0" }
flargs-macros = { path = "crates/flargs-macros", version = "0.0.0" }
hmac = "0.13.0"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
insta = "1.49.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "3.0.9", default-features = false, features = ["parsing", "printing", "proc-macro"] }
tokio = "1.54.1"
toml = "1.1.8"
tower-layer = "0.3.3"
tower-service = "0.3.3"
trybuild = "1.0.122"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
similar_names = "allow"
todo = "warn"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
