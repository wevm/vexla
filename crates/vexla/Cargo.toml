[package]
name = "vexla"
description = "Feature flags for trunk-based development."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
axum = ["axum/original-uri", "dep:axum", "server"]
build = ["client", "reqwest/blocking"]
client = ["dep:reqwest", "reqwest/json"]
default = ["macros"]
macros = ["dep:vexla-macros"]
server = [
    "dep:bytes",
    "dep:http-body",
    "dep:http-body-util",
    "dep:tower-layer",
    "dep:tower-service",
]

[dependencies]
axum = { workspace = true, optional = true }
base64.workspace = true
bytes = { workspace = true, optional = true }
vexla-definitions.workspace = true
vexla-macros = { workspace = true, optional = true }
hmac.workspace = true
http.workspace = true
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
tower-layer = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio"] }
# Integration tests cover every feature, so `cargo test --workspace` runs them.
vexla = { path = ".", features = ["axum", "build", "client", "server"] }
http.workspace = true
insta.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
trybuild.workspace = true

[lints]
workspace = true
